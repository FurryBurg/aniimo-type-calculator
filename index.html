
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伊莫 Aniimo｜屬性剋制計算器 Type Calculator</title>
<style>
:root{
    color-scheme:dark;
    font-family:system-ui,"Microsoft JhengHei",sans-serif;
    font-size:clamp(14px,1vw,18px);
    --bg:#10141c;
    --panel:#1a202b;
    --card:#222b38;
    --line:#394557;
    --text:#f3f5f8;
    --muted:#aeb9ca;
    --strong:#f6a93c;
    --resist:#a373d2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid white;outline-offset:2px}
h1,h2,h3{margin:0}
header,main{width:min(1700px,98%);margin:auto}
header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:20px 0 14px;
}
header h1{font-size:clamp(20px,2.3vw,34px)}
header h1:last-child{text-align:right}
main{padding-bottom:24px}

/* 共用面板 */
.teams{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}
.panel,.explorer{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    min-width:0;
}
.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
}
.panel-title,.explorer-title{
    font-size:1.1rem;
    font-weight:800;
    white-space:nowrap;
}
.panel-actions{display:flex;align-items:center;gap:7px}
.team-clear,.team-weakness-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    border-radius:8px;
    padding:7px 11px;
    font-size:.77rem;
    white-space:nowrap;
}
.team-clear:hover,.team-weakness-btn:hover{
    background:#374358;
    color:white;
}
.team-weakness-btn.active{
    color:white;
    background:#344357;
    border-color:#91a7c3;
}

/* 隊伍卡片 */
.slots{display:grid;gap:8px}
.slot{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
}
.slot-body{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}
.selection{
    display:flex;
    gap:6px;
    flex-shrink:0;
}

/* 原始 attributes.png Sprite */
.aniimo-icon{
    --type-index:0;
    --type-color:#999;
    --icon-size:20px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--type-color);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    vertical-align:middle;
}
.aniimo-icon i{
    display:block;
    width:var(--icon-size);
    height:var(--icon-size);
    background:url("attributes.png") no-repeat;
    background-size:var(--icon-size) calc(var(--icon-size) * 9);
    background-position:0 calc(var(--type-index) * var(--icon-size) * -1);
}
.aniimo-icon.grass{--type-color:rgb(81,177,122);--type-index:0}
.aniimo-icon.fire{--type-color:rgb(226,97,97);--type-index:1}
.aniimo-icon.electric{--type-color:rgb(224,194,26);--type-index:2}
.aniimo-icon.earth{--type-color:rgb(190,167,123);--type-index:3}
.aniimo-icon.wind{--type-color:rgb(88,199,177);--type-index:4}
.aniimo-icon.water{--type-color:rgb(82,157,231);--type-index:5}
.aniimo-icon.light{--type-color:rgb(246,169,60);--type-index:6}
.aniimo-icon.dark{--type-color:rgb(163,115,210);--type-index:7}
.aniimo-icon.ice{--type-color:rgb(69,193,214);--type-index:8}

/* 可拖曳的屬性圖標 */
.aniimo-icon[data-drag-type],
.svg-type-node{
    cursor:grab;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}
.aniimo-icon[data-drag-type]:active,
.svg-type-node:active{cursor:grabbing}
.aniimo-icon[data-drag-type] i{pointer-events:none}
body.dragging-type{
    cursor:grabbing!important;
    user-select:none;
    -webkit-user-select:none;
}
.drag-ghost{
    position:fixed;
    left:0;
    top:0;
    z-index:9999;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#202b3aee;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:0 8px 28px #000a;
    pointer-events:none;
    transform:translate(-50%,-50%);
}
.drag-ghost .aniimo-icon{
    --icon-size:32px;
    width:48px;
    height:48px;
}
.type-button.drag-over{
    background:#435778;
    border:3px solid #fff;
    box-shadow:0 0 0 4px #88b8ff66;
    transform:scale(1.08);
}

/* 隊伍屬性選擇 */
.type-button{
    width:50px;
    height:50px;
    border:2px dashed #657186;
    border-radius:50%;
    padding:2px;
    background:#161d28;
    color:#cad3df;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:background .12s,border-color .12s,transform .12s;
}
.type-button.filled{border-style:solid}
.type-button:hover{border-color:white}
.type-button .aniimo-icon{
    --icon-size:30px;
    width:42px;
    height:42px;
}
.plus{font-size:1.5rem}

/* 弱點與抗性 */
.slot-info{
    flex:1;
    min-width:0;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}
.info-cell{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}
.info-label{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex-shrink:0;
    width:45px;
}
.info-label .zh{font-size:.77rem;font-weight:800}
.info-label .en{font-size:.68rem;color:var(--muted)}
.info-tags{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    min-width:0;
}
.result-icon{display:inline-flex;align-items:center}
.result-icon .aniimo-icon{
    --icon-size:17px;
    width:25px;
    height:25px;
}
.empty{font-size:.75rem;color:#8190a5}
.bonus-group{
    display:inline-flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    padding:4px 6px;
    border-radius:20px;
}
.bonus-strong{
    background:#f6a93c40;
    border:1px solid var(--strong);
}
.bonus-resist{
    background:#a373d240;
    border:1px solid var(--resist);
}
.bonus-group .aniimo-icon{
    --icon-size:17px;
    width:25px;
    height:25px;
}

/* 隊伍分析 */
.team-analysis{
    margin-top:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#18202b;
    min-width:0;
}
.team-analysis[hidden]{display:none}
.team-analysis-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.team-analysis-row{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}
.team-analysis-label{
    width:50px;
    flex-shrink:0;
    font-size:.75rem;
    font-weight:800;
    color:var(--muted);
}
.team-analysis-items{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding:2px 0;
}
.team-analysis-item{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:5px 9px;
    min-height:38px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
}
.team-analysis-item .aniimo-icon{
    --icon-size:19px;
    width:28px;
    height:28px;
}
.team-analysis-row.weak .team-analysis-item{
    background:#69412b;
    border-color:#a77850;
}
.team-analysis-row.resist .team-analysis-item{
    background:#403159;
    border-color:#8868b3;
}
.team-analysis-empty{
    color:var(--muted);
    font-size:.75rem;
    white-space:nowrap;
}

/* 屬性研究 */
.explorer{margin:12px 0 0}
.explorer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:14px;
    min-width:0;
}
.primary-selector{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    flex:1;
    min-width:0;
}
.primary-button{
    width:44px;
    height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:2px solid #546176;
    border-radius:50%;
    background:#151d28;
    padding:2px;
    flex-shrink:0;
}
.primary-button .aniimo-icon{
    --icon-size:23px;
    width:36px;
    height:36px;
}
.primary-button:hover{border-color:white}
.primary-button.active{
    border-color:white;
    box-shadow:0 0 0 2px #ffffff45;
}

/* 倍率圖例 */
.legend{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    flex-wrap:wrap;
    flex-shrink:0;
    font-size:.82rem;
    font-weight:700;
}
.legend-item{
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
}
.legend-sample{
    width:27px;
    height:27px;
    border-radius:9px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.legend-sample.strong{
    background:#f6a93c40;
    border:1px solid var(--strong);
}
.legend-sample.resist{
    background:#a373d240;
    border:1px solid var(--resist);
}
.legend-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#e0e7f0;
}

/* 比較表與關係網 */
.research-layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    gap:12px;
    align-items:stretch;
}
.research-panel{
    min-width:0;
    background:#18202b;
    border:1px solid var(--line);
    border-radius:11px;
    padding:12px;
    display:flex;
    flex-direction:column;
}
.research-table-wrap{
    flex:1;
    min-height:0;
    overflow-x:auto;
    overflow-y:hidden;
}
.research-table{
    width:100%;
    min-width:470px;
    height:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0 5px;
    font-size:.78rem;
}
.research-table thead tr{height:42px}
.research-table tbody tr{height:61px}
.research-table th{
    text-align:left;
    padding:7px 12px;
    color:var(--muted);
    font-weight:700;
}
.research-table th:first-child{width:120px}
.research-table td{
    height:61px;
    padding:5px 10px;
    background:var(--card);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    vertical-align:middle;
}
.research-table td:first-child{
    border-left:1px solid var(--line);
    border-radius:8px 0 0 8px;
}
.research-table td:last-child{
    border-right:1px solid var(--line);
    border-radius:0 8px 8px 0;
}
.research-table tr.selected td{
    background:#344357;
    border-top-color:#a0b4ce;
    border-bottom-color:#a0b4ce;
}
.research-table tr.selected td:first-child{border-left-color:#a0b4ce}
.research-table tr.selected td:last-child{border-right-color:#a0b4ce}
.research-table tr[data-pair]{cursor:pointer}
.research-table tr[data-pair]:hover td{background:#3a495d}
.research-table tr[data-pair]:focus-visible{
    outline:2px solid white;
    outline-offset:-2px;
}
.pair-label{
    display:flex;
    align-items:center;
    gap:6px;
    height:43px;
    white-space:nowrap;
}
.pair-label .aniimo-icon{
    --icon-size:25px;
    width:38px;
    height:38px;
}
.table-icons{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    min-height:43px;
}
.table-icons .aniimo-icon{
    --icon-size:21px;
    width:32px;
    height:32px;
}
.table-icons .bonus-group{
    padding:4px 6px;
    gap:4px;
    flex-wrap:nowrap;
}
.table-icons .bonus-group .aniimo-icon{
    --icon-size:21px;
    width:32px;
    height:32px;
}

/* 關係網 */
.network-wrap{
    width:100%;
    flex:1;
    min-height:600px;
    border:1px solid #354155;
    border-radius:12px;
    background:radial-gradient(circle at center,#29364a 0%,#18202b 70%);
    overflow:hidden;
}
.network-wrap svg{
    display:block;
    width:100%;
    height:100%;
}
.svg-type-node{pointer-events:all}
.svg-type-node image{pointer-events:none}

/* 屬性選擇視窗 */
.picker-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
}
.picker-backdrop[hidden]{display:none}
.picker{
    width:min(520px,100%);
    background:var(--card);
    border:1px solid #667286;
    border-radius:16px;
    padding:16px;
}
.picker-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-weight:800;
}
.picker-close{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:1.2rem;
}
.icon-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}
.pick{
    min-height:78px;
    border:2px solid #4c596c;
    border-radius:10px;
    background:#151c26;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
}
.pick .aniimo-icon{
    --icon-size:30px;
    width:44px;
    height:44px;
}
.pick small{font-size:.73rem}
.pick:hover,.pick.selected{
    border-color:white;
    background:#364152;
}
.picker-foot{display:flex;gap:8px;margin-top:12px}
.picker-foot button{
    flex:1;
    background:#303c4e;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    color:var(--text);
}
.picker-foot button:hover{background:#435168}

/* 響應式 */
@media(max-width:1450px){
    .explorer-header{flex-wrap:wrap}
    .primary-selector{justify-content:center}
}
@media(max-width:1250px){
    .teams{grid-template-columns:1fr}
}
@media(max-width:1050px){
    .research-layout{grid-template-columns:1fr}
    .network-wrap{
        flex:none;
        height:min(85vw,650px);
        min-height:420px;
    }
    .research-table{height:auto}
}
@media(max-width:700px){
    .explorer-header{justify-content:flex-start;gap:12px}
    .explorer-title{width:100%}
    .primary-selector{justify-content:flex-start;flex:none}
    .legend{margin-left:auto}
}
@media(max-width:650px){
    header,main{
        width:100%;
        padding-left:7px;
        padding-right:7px;
    }
    .panel,.explorer{padding:9px}
    .slot{padding:8px}
    .slot-body{gap:8px}
    .selection{gap:4px}
    .type-button{width:43px;height:43px}
    .type-button .aniimo-icon{
        --icon-size:24px;
        width:35px;height:35px;
    }
    .slot-info{gap:5px}
    .info-cell{gap:4px}
    .info-label{width:39px}
    .info-label .zh{font-size:.69rem}
    .info-label .en{font-size:.61rem}
    .result-icon .aniimo-icon,
    .bonus-group .aniimo-icon{
        --icon-size:13px;
        width:20px;height:20px;
    }
    .bonus-group{padding:3px}
    .team-analysis{padding:7px}
    .team-analysis-row{gap:6px}
    .team-analysis-label{width:43px;font-size:.68rem}
    .team-analysis-items{gap:5px}
    .team-analysis-item{padding:4px 7px;gap:5px}
    .team-analysis-item .aniimo-icon{
        --icon-size:15px;
        width:23px;height:23px;
    }
    .primary-button{width:40px;height:40px}
    .primary-button .aniimo-icon{
        --icon-size:20px;
        width:32px;height:32px;
    }
    .research-panel{padding:8px}
    .research-table{min-width:420px}
    .research-table th:first-child{width:92px}
    .research-table thead tr{height:38px}
    .research-table tbody tr,
    .research-table td{height:54px}
    .research-table th,
    .research-table td{padding:4px 6px}
    .pair-label{height:38px;gap:3px}
    .pair-label .aniimo-icon{
        --icon-size:19px;
        width:29px;height:29px;
    }
    .table-icons{min-height:38px;gap:3px}
    .table-icons .aniimo-icon,
    .table-icons .bonus-group .aniimo-icon{
        --icon-size:16px;
        width:25px;height:25px;
    }
    .table-icons .bonus-group{padding:3px}
    .network-wrap{height:90vw;min-height:340px}
}
@media(max-width:390px){
    .slot-body{gap:5px}
    .type-button{width:37px;height:37px}
    .type-button .aniimo-icon{
        --icon-size:20px;
        width:29px;height:29px;
    }
    .info-label{width:35px}
    .info-label .zh{font-size:.65rem}
    .info-label .en{font-size:.56rem}
    .result-icon .aniimo-icon,
    .bonus-group .aniimo-icon{
        --icon-size:11px;
        width:18px;height:18px;
    }
}
.dual-orbit{
    transform-origin:240px 240px;
    animation:dualOrbit 8s linear infinite;
}

.dual-orbit .svg-type-node{
    animation:dualCounterOrbit 8s linear infinite;
}

@keyframes dualOrbit{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes dualCounterOrbit{
    from{transform:rotate(0deg)}
    to{transform:rotate(-360deg)}
}

@media(prefers-reduced-motion:reduce){
    .dual-orbit,
    .dual-orbit .svg-type-node{
        animation:none;
    }
}
</style>
</head>
<body>

<header>
    <h1>伊莫 Aniimo</h1>
    <h1>屬性剋制計算器 Type Calculator</h1>
</header>

<main>
    <section class="teams">
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">我方隊伍｜My Team</h2>

                <div class="panel-actions">
                    <button class="team-weakness-btn"
                        id="teamWeaknessBtn"
                        aria-expanded="false"
                        aria-controls="teamAnalysis enemyTeamAnalysis">
                        分析 Analysis
                    </button>
                    <button class="team-clear" data-clear-team="ally">
                        清空｜Clear
                    </button>
                </div>
            </div>

            <div class="slots" id="allySlots"></div>

            <div class="team-analysis" id="teamAnalysis" hidden>
                <div class="team-analysis-grid" id="teamAnalysisGrid"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">敵方隊伍｜Enemy Team</h2>
                <button class="team-clear" data-clear-team="enemy">
                    清空｜Clear
                </button>
            </div>

            <div class="slots" id="enemySlots"></div>

            <div class="team-analysis" id="enemyTeamAnalysis" hidden>
                <div class="team-analysis-grid" id="enemyTeamAnalysisGrid"></div>
            </div>
        </div>
    </section>

    <section class="explorer">
        <div class="explorer-header">
            <h2 class="explorer-title">屬性研究｜Type Explorer</h2>

            <div class="primary-selector"
                id="primaryButtons"
                aria-label="主屬性選擇"></div>

            <div class="legend" aria-label="特殊倍率圖例">
                <span class="legend-item" title="雙重剋制">
                    <span class="legend-sample strong">
                        <span class="legend-dot"></span>
                    </span>
                    2.56
                </span>
                <span class="legend-item" title="雙重抗性">
                    <span class="legend-sample resist">
                        <span class="legend-dot"></span>
                    </span>
                    0.390625
                </span>
            </div>
        </div>

        <div class="research-layout">
            <div class="research-panel">
                <div class="research-table-wrap" id="researchTable"></div>
            </div>

            <div class="research-panel">
                <div class="network-wrap" id="networkGraph"></div>
            </div>
        </div>
    </section>
</main>

<div class="picker-backdrop" id="pickerBackdrop" hidden>
    <div class="picker" role="dialog"
        aria-modal="true" aria-labelledby="pickerTitle">
        <div class="picker-title">
            <span id="pickerTitle">選擇屬性</span>
            <button class="picker-close" id="pickerClose"
                aria-label="關閉">✕</button>
        </div>
        <div class="icon-grid" id="pickerGrid"></div>
        <div class="picker-foot">
            <button id="pickerClear">清除此屬性</button>
            <button id="pickerCancel">返回</button>
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================
   屬性資料
   ========================= */

const TYPES=[
    {id:"grass",name:"草"},
    {id:"fire",name:"火"},
    {id:"electric",name:"電"},
    {id:"earth",name:"土"},
    {id:"wind",name:"風"},
    {id:"water",name:"水"},
    {id:"light",name:"光"},
    {id:"dark",name:"暗"},
    {id:"ice",name:"冰"}
];

const COLORS={
    grass:"#51b17a",
    fire:"#e26161",
    electric:"#e0c21a",
    earth:"#bea77b",
    wind:"#58c7b1",
    water:"#529de7",
    light:"#f6a93c",
    dark:"#a373d2",
    ice:"#45c1d6"
};

const IDS=TYPES.map(t=>t.id);
const TYPE_MAP=Object.fromEntries(TYPES.map(t=>[t.id,t]));

const ADVANTAGE={
    fire:["grass","ice"],
    water:["fire","earth"],
    grass:["water","earth"],
    electric:["water","wind"],
    ice:["water","electric"],
    earth:["fire","ice"],
    wind:["grass","dark"],
    dark:["grass","electric","light"],
    light:["wind","dark"]
};

const RESISTED={
    fire:["fire","water","earth","light"],
    water:["water","grass","ice","light"],
    grass:["fire","grass","light"],
    electric:["electric","ice","earth"],
    ice:["fire","ice","earth"],
    earth:["water","grass","earth","dark"],
    wind:["electric","wind"],
    dark:["water","wind"],
    light:["electric","light"]
};
const ORBIT_DURATION=8000;
let orbitStartTime=performance.now();

/* =========================
   計算與儲存
   ========================= */
function getOrbitDelay(){
    const elapsed=(performance.now()-orbitStartTime)%ORBIT_DURATION;
    return `-${elapsed}ms`;
}
function multiplier(attack,defense){
    if(ADVANTAGE[attack]?.includes(defense)) return 1.6;
    if(RESISTED[attack]?.includes(defense)) return 0.625;
    return 1;
}

function blankTeam(){
    return Array.from({length:4},()=>[null,null]);
}

function blankState(){
    return {ally:blankTeam(),enemy:blankTeam()};
}

function validSlot(slot){
    if(!Array.isArray(slot)) return [null,null];

    const a=IDS.includes(slot[0])?slot[0]:null;
    const b=IDS.includes(slot[1])&&slot[1]!==a?slot[1]:null;

    return a?[a,b]:b?[b,null]:[null,null];
}

function loadState(){
    try{
        const saved=JSON.parse(
            localStorage.getItem("aniimo-type-team-v8")
        );

        if(!saved) return blankState();

        const result=blankState();

        for(const side of ["ally","enemy"]){
            if(Array.isArray(saved[side])){
                result[side]=saved[side].slice(0,4).map(validSlot);
            }

            while(result[side].length<4){
                result[side].push([null,null]);
            }
        }

        return result;
    }catch{
        return blankState();
    }
}

let state=loadState();
let activePicker=null;
let previousFocus=null;
let primaryType="grass";
let pairedType=null;
let teamAnalysisOpen=false;

try{
    const p=localStorage.getItem("aniimo-explorer-primary");
    const s=localStorage.getItem("aniimo-explorer-pair");

    if(IDS.includes(p)) primaryType=p;
    if(IDS.includes(s)&&s!==primaryType) pairedType=s;

    teamAnalysisOpen=
        localStorage.getItem("aniimo-team-analysis-open")==="true";
}catch{}

function save(){
    try{
        localStorage.setItem(
            "aniimo-type-team-v8",
            JSON.stringify(state)
        );

        localStorage.setItem(
            "aniimo-explorer-primary",
            primaryType
        );

        if(pairedType){
            localStorage.setItem("aniimo-explorer-pair",pairedType);
        }else{
            localStorage.removeItem("aniimo-explorer-pair");
        }

        localStorage.setItem(
            "aniimo-team-analysis-open",
            String(teamAnalysisOpen)
        );
    }catch{}
}

function slotTypes(slot){
    return slot.filter(Boolean);
}

function eq(a,b){
    return a!==null&&Math.abs(a-b)<0.00001;
}

function fmt(n){
    return Number(n.toFixed(6)).toString();
}

/*
    所有一般 HTML 屬性圖標都可拖曳。
    不使用瀏覽器原生 dragstart，
    改用 Pointer Events 同時支援滑鼠與觸控。
*/
function iconHTML(id){
    if(!id) return "";

    return `<span
        class="aniimo-icon ${id}"
        data-drag-type="${id}"
        role="img"
        aria-label="${TYPE_MAP[id].name}"
        title="${TYPE_MAP[id].name}｜按住拖曳可套用到隊伍">
        <i aria-hidden="true"></i>
    </span>`;
}

function attackValue(attack,defenseSlot){
    const defenses=slotTypes(defenseSlot);

    if(!attack||!defenses.length) return null;

    return defenses.reduce(
        (value,t)=>value*multiplier(attack,t),1
    );
}

function defenseAnalysis(slot){
    const result={
        weakness:{normal:[],bonus:[]},
        resistance:{normal:[],bonus:[]}
    };

    if(!slotTypes(slot).length) return result;

    for(const type of TYPES){
        const value=attackValue(type.id,slot);

        if(eq(value,1.6)){
            result.weakness.normal.push({id:type.id});
        }else if(eq(value,2.56)){
            result.weakness.bonus.push({id:type.id});
        }else if(eq(value,0.625)){
            result.resistance.normal.push({id:type.id});
        }else if(eq(value,0.390625)){
            result.resistance.bonus.push({id:type.id});
        }
    }

    return result;
}

function normalIcons(items){
    return items.map(x=>`
        <span class="result-icon">${iconHTML(x.id)}</span>
    `).join("");
}

function bonusIcons(items,kind){
    if(!items.length) return "";

    const cls=kind==="strong"?"bonus-strong":"bonus-resist";
    const value=kind==="strong"?"2.56":"0.390625";

    return `<span class="bonus-group ${cls}" title="×${value}">
        ${items.map(x=>`
            <span class="result-icon">${iconHTML(x.id)}</span>
        `).join("")}
    </span>`;
}

function infoCell(zh,en,data,kind){
    const content=normalIcons(data.normal)+bonusIcons(data.bonus,kind);

    return `<div class="info-cell">
        <div class="info-label">
            <span class="zh">${zh}</span>
            <span class="en">${en}</span>
        </div>
        <div class="info-tags">
            ${content||'<span class="empty">—</span>'}
        </div>
    </div>`;
}

/* =========================
   隊伍畫面
   ========================= */

function slotHTML(side,index){
    const slot=state[side][index];
    const sideName=side==="ally"?"我方":"敵方";
    const defense=defenseAnalysis(slot);

    return `<article class="slot">
        <div class="slot-body">

            <div class="selection">
                ${[0,1].map(pos=>`
                    <button
                        class="type-button ${slot[pos]?"filled":""}"
                        data-pick="${side}:${index}:${pos}"
                        data-slot-source="${side}:${index}:${pos}"
                        aria-label="${sideName}${index+1}，第${pos+1}屬性">
                        ${slot[pos]
                            ?iconHTML(slot[pos])
                            :'<span class="plus">＋</span>'}
                    </button>
                `).join("")}
            </div>

            <div class="slot-info">
                ${infoCell("弱點","Weak",defense.weakness,"strong")}
                ${infoCell("抗性","Resist",defense.resistance,"resist")}
            </div>

        </div>
    </article>`;
}

function renderTeams(){
    document.getElementById("allySlots").innerHTML=
        state.ally.map((_,i)=>slotHTML("ally",i)).join("");

    document.getElementById("enemySlots").innerHTML=
        state.enemy.map((_,i)=>slotHTML("enemy",i)).join("");

    renderTeamAnalysis();
}

/* =========================
   隊伍分析：Weak / Resist
   ========================= */

function renderTeamAnalysis(){
    const button=document.getElementById("teamWeaknessBtn");

    button.classList.toggle("active",teamAnalysisOpen);
    button.setAttribute("aria-expanded",String(teamAnalysisOpen));

    const panels=[
        ["ally","teamAnalysis","teamAnalysisGrid"],
        ["enemy","enemyTeamAnalysis","enemyTeamAnalysisGrid"]
    ];

    for(const [side,panelId,gridId] of panels){
        const panel=document.getElementById(panelId);
        panel.hidden=!teamAnalysisOpen;

        if(!teamAnalysisOpen) continue;

        const configured=state[side].filter(
            slot=>slotTypes(slot).length>0
        );

        const weakness=[];
        const resistance=[];

        for(const type of TYPES){
            let weak=0;
            let resist=0;

            for(const slot of configured){
                const value=attackValue(type.id,slot);

                if(value>1.00001) weak++;
                else if(value<0.99999) resist++;
            }

            if(weak>0){
                weakness.push({id:type.id,count:weak});
            }

            if(resist>0){
                resistance.push({id:type.id,count:resist});
            }
        }

        weakness.sort((a,b)=>b.count-a.count);
        resistance.sort((a,b)=>b.count-a.count);

        function analysisRow(label,kind,items){
            return `<div class="team-analysis-row ${kind}">
                <span class="team-analysis-label">${label}</span>

                <div class="team-analysis-items">
                    ${items.length
                        ?items.map(type=>`
                            <div class="team-analysis-item"
                                title="${TYPE_MAP[type.id].name}：${type.count} 個位置${kind==="weak"?"有弱點":"有抗性"}">
                                ${iconHTML(type.id)}
                                <span>×${type.count}</span>
                            </div>
                        `).join("")
                        :'<span class="team-analysis-empty">—</span>'}
                </div>
            </div>`;
        }

        document.getElementById(gridId).innerHTML=
            analysisRow("Weak","weak",weakness)+
            analysisRow("Resist","resist",resistance);
    }
}

/* =========================
   隊伍屬性設定
   ========================= */

function setType(side,index,pos,type){
    const slot=state[side][index];
    const other=1-pos;

    if(!type){
        if(pos===0){
            slot[0]=slot[1];
            slot[1]=null;
        }else{
            slot[1]=null;
        }
    }else if(slot[other]===type){
        // 選到另一格既有的屬性時，交換位置。
        [slot[0],slot[1]]=[slot[1],slot[0]];
    }else if(pos===1&&!slot[0]){
        slot[0]=type;
        slot[1]=null;
    }else{
        slot[pos]=type;
    }

    renderTeams();
    save();
}

/* =========================
   屬性選擇視窗
   ========================= */

function closePicker(){
    document.getElementById("pickerBackdrop").hidden=true;
    activePicker=null;

    if(previousFocus?.isConnected){
        previousFocus.focus();
    }

    previousFocus=null;
}

function openPicker(side,index,pos){
    previousFocus=document.activeElement;
    activePicker={side,index,pos};

    const slot=state[side][index];

    document.getElementById("pickerTitle").textContent=
        `${side==="ally"?"我方":"敵方"} ${index+1}｜選擇第 ${pos+1} 屬性`;

    document.getElementById("pickerGrid").innerHTML=TYPES.map(t=>{
        const selected=slot[pos]===t.id;
        const otherSelected=slot[1-pos]===t.id;

        return `<button
            class="pick ${selected||otherSelected?"selected":""}"
            data-type="${t.id}"
            aria-pressed="${selected}">
            ${iconHTML(t.id)}
            <small>${t.name}${otherSelected?" ⇄":""}</small>
        </button>`;
    }).join("");

    document.getElementById("pickerBackdrop").hidden=false;
    document.querySelector("#pickerGrid .pick")?.focus();
}

/* =========================
   屬性研究
   ========================= */

function renderPrimaryButtons(){
    document.getElementById("primaryButtons").innerHTML=TYPES.map(t=>`
        <button
            class="primary-button ${primaryType===t.id?"active":""}"
            data-primary="${t.id}"
            aria-pressed="${primaryType===t.id}"
            title="${t.name}屬性">
            ${iconHTML(t.id)}
        </button>
    `).join("");
}

function tableIcons(slot,kind){
    const data=defenseAnalysis(slot)[kind];
    const style=kind==="weakness"?"strong":"resist";

    return normalIcons(data.normal)+
        bonusIcons(data.bonus,style)||
        '<span class="empty">—</span>';
}

function renderResearchTable(){
    const rows=[
        {pair:null,slot:[primaryType,null]},
        ...IDS.filter(id=>id!==primaryType)
            .map(id=>({pair:id,slot:[primaryType,id]}))
    ];

    document.getElementById("researchTable").innerHTML=`
        <table class="research-table">
            <thead>
                <tr>
                    <th>屬性組合</th>
                    <th>弱點 Weak</th>
                    <th>抗性 Resist</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(row=>`
                    <tr
                        data-pair="${row.pair||""}"
                        tabindex="0"
                        aria-selected="${pairedType===row.pair}"
                        class="${pairedType===row.pair?"selected":""}"
                        title="點擊查看關係網">

                        <td>
                            <div class="pair-label">
                                ${row.slot.filter(Boolean).map(iconHTML).join("")}
                            </div>
                        </td>

                        <td>
                            <div class="table-icons">
                                ${tableIcons(row.slot,"weakness")}
                            </div>
                        </td>

                        <td>
                            <div class="table-icons">
                                ${tableIcons(row.slot,"resistance")}
                            </div>
                        </td>
                    </tr>
                `).join("")}
            </tbody>
        </table>`;
}

/* =========================
   SVG 屬性圖標與關係網
   ========================= */

function svgIcon(id,x,y,size){
    const idx=IDS.indexOf(id);
    const r=size/2;
    const clip=`clip-${id}-${Math.round(x)}-${Math.round(y)}`;
    const inner=size*.69;
    const offset=(size-inner)/2;

    return `
        <g class="svg-type-node"
            data-drag-type="${id}"
            aria-label="${TYPE_MAP[id].name}屬性"
            style="transform-origin:${x+r}px ${y+r}px">

            <defs>
                <clipPath id="${clip}">
                    <rect
                        x="${x+offset}"
                        y="${y+offset}"
                        width="${inner}"
                        height="${inner}"/>
                </clipPath>
            </defs>

            <circle
                cx="${x+r}"
                cy="${y+r}"
                r="${r}"
                fill="${COLORS[id]}"/>

            <image
                href="attributes.png"
                x="${x+offset}"
                y="${y+offset-idx*inner}"
                width="${inner}"
                height="${inner*9}"
                clip-path="url(#${clip})"
                preserveAspectRatio="none"/>

        </g>`;
}

function networkStyle(value){
    if(eq(value,2.56)){
        return {stroke:"#ffbf6b",width:5,label:"#ffdcaa"};
    }
    if(eq(value,1.6)){
        return {stroke:"#d99b57",width:3,label:"#ffd09a"};
    }
    if(eq(value,0.390625)){
        return {stroke:"#c49af0",width:5,label:"#e2caff"};
    }
    if(eq(value,0.625)){
        return {stroke:"#9170b8",width:3,label:"#d6c1f2"};
    }
    return {stroke:"#66758a",width:1.5,label:"#acb7c8"};
}

function renderNetwork(){
    const defense=[primaryType,pairedType];
    const center=240;
    const radius=176;

    let lines="";
    let nodes="";

    TYPES.forEach((type,i)=>{
        const angle=(-90+i*40)*Math.PI/180;
        const x=center+Math.cos(angle)*radius;
        const y=center+Math.sin(angle)*radius;

        const value=attackValue(type.id,defense);
        const style=networkStyle(value);

        const vx=center-x;
        const vy=center-y;
        const length=Math.hypot(vx,vy);
        const ux=vx/length;
        const uy=vy/length;

        const startX=x+ux*30;
        const startY=y+uy*30;
        const endX=center-ux*63;
        const endY=center-uy*63;

        const labelX=x+ux*65;
        const labelY=y+uy*65;
        const markerId=`arrow-${i}`;

        lines+=`
            <defs>
                <marker id="${markerId}"
                    markerWidth="6"
                    markerHeight="6"
                    refX="4.5"
                    refY="3"
                    orient="auto"
                    markerUnits="userSpaceOnUse">
                    <path
                        d="M0 0 L6 3 L0 6 Z"
                        fill="${style.stroke}"/>
                </marker>
            </defs>

            <line
                x1="${startX}"
                y1="${startY}"
                x2="${endX}"
                y2="${endY}"
                stroke="${style.stroke}"
                stroke-width="${style.width}"
                stroke-linecap="round"
                marker-end="url(#${markerId})"
                opacity="${eq(value,1)?.55:1}"/>

            ${!eq(value,1)?`
                <rect
                    x="${labelX-25}"
                    y="${labelY-11}"
                    width="50"
                    height="22"
                    rx="7"
                    fill="#101722"
                    stroke="#354052"/>

                <text
                    x="${labelX}"
                    y="${labelY+4}"
                    text-anchor="middle"
                    font-size="12"
                    font-weight="700"
                    fill="${style.label}">
                    ${fmt(value)}×
                </text>
            `:""}
        `;

        nodes+=svgIcon(type.id,x-26,y-26,52);
    });

      const orbitDelay=getOrbitDelay();

      const centerNodes=pairedType
          ?`<g class="dual-orbit" style="animation-delay:${orbitDelay}">
              ${svgIcon(primaryType,center-51,center-23,46)
                  .replace('class="svg-type-node"',
                           `class="svg-type-node" style="animation-delay:${orbitDelay};transform-origin:${center-28}px ${center}px"`)}
              ${svgIcon(pairedType,center+5,center-23,46)
                  .replace('class="svg-type-node"',
                           `class="svg-type-node" style="animation-delay:${orbitDelay};transform-origin:${center+28}px ${center}px"`)}
            </g>`
          :svgIcon(primaryType,center-28,center-28,56);

    document.getElementById("networkGraph").innerHTML=`
        <svg
            viewBox="0 0 480 480"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="屬性剋制關係網">

            ${lines}

            <circle
                cx="240"
                cy="240"
                r="60"
                fill="#202b3a"
                stroke="#aeb9ca"
                stroke-width="2"/>

            ${centerNodes}
            ${nodes}
        </svg>`;
}

function renderExplorer(){
    renderPrimaryButtons();
    renderResearchTable();
    renderNetwork();
    save();
}

/* =========================
   全域屬性拖曳功能
   ========================= */

/*
    拖曳來源：
    任何帶有 data-drag-type 的圖標。

    拖曳目標：
    我方或敵方隊伍的 data-pick 按鈕。

    這裡使用 Pointer Events，
    讓滑鼠、觸控與 SVG 圖標共用同一套邏輯。
*/

let dragSession=null;
let dragGhost=null;
let dragTarget=null;
let suppressNextClick=false;

function createDragGhost(type){
    const ghost=document.createElement("div");
    ghost.className="drag-ghost";

    ghost.innerHTML=iconHTML(type);
    document.body.appendChild(ghost);

    return ghost;
}

function moveDragGhost(x,y){
    if(!dragGhost) return;

    dragGhost.style.left=x+"px";
    dragGhost.style.top=y+"px";
}

function findDropTarget(x,y){
    const el=document.elementFromPoint(x,y);
    return el?.closest(".type-button[data-pick]")||null;
}

function highlightDropTarget(target){
    if(dragTarget===target) return;

    if(dragTarget){
        dragTarget.classList.remove("drag-over");
    }

    dragTarget=target;

    if(dragTarget){
        dragTarget.classList.add("drag-over");
    }
}

function clearDragVisual(){
    if(dragTarget){
        dragTarget.classList.remove("drag-over");
    }

    dragTarget=null;

    if(dragGhost){
        dragGhost.remove();
    }

    dragGhost=null;
    document.body.classList.remove("dragging-type");
}

function resetDrag(){
    clearDragVisual();
    dragSession=null;
}

document.addEventListener("pointerdown",e=>{
    if(e.button!==0||dragSession) return;

    const source=e.target.closest("[data-drag-type]");
    if(!source) return;

    const type=source.dataset.dragType;
    if(!IDS.includes(type)) return;

    const slotButton=source.closest(".type-button[data-slot-source]");

    dragSession={
        pointerId:e.pointerId,
        type,
        startX:e.clientX,
        startY:e.clientY,
        dragging:false,
        sourceSlot:slotButton?.dataset.slotSource||null
    };
});

document.addEventListener("pointermove",e=>{
    if(!dragSession) return;
    if(e.pointerId!==dragSession.pointerId) return;

    const dx=e.clientX-dragSession.startX;
    const dy=e.clientY-dragSession.startY;

    if(!dragSession.dragging){
        // 小幅移動視為一般點擊，超過門檻才開始拖曳。
        if(Math.hypot(dx,dy)<8) return;

        dragSession.dragging=true;
        dragGhost=createDragGhost(dragSession.type);
        document.body.classList.add("dragging-type");
    }

    e.preventDefault();

    moveDragGhost(e.clientX,e.clientY);

    const target=findDropTarget(e.clientX,e.clientY);
    highlightDropTarget(target);
}, {passive:false});

document.addEventListener("pointerup",e=>{
    if(!dragSession||e.pointerId!==dragSession.pointerId) return;

    const session=dragSession;

    if(!session.dragging){
        resetDrag();
        return;
    }

    const target=findDropTarget(e.clientX,e.clientY);
    suppressNextClick=true;

    resetDrag();

    if(target){
        const [side,index,pos]=target.dataset.pick.split(":");
        setType(side,Number(index),Number(pos),session.type);
    }else if(session.sourceSlot){
        const [side,index,pos]=session.sourceSlot.split(":");

        // 確認來源位置仍然是原本的屬性，才執行清除。
        if(state[side][Number(index)][Number(pos)]===session.type){
            setType(side,Number(index),Number(pos),null);
        }
    }

    setTimeout(()=>{
        suppressNextClick=false;
    },0);
});

document.addEventListener("pointercancel",e=>{
    if(dragSession&&e.pointerId===dragSession.pointerId){
        resetDrag();
    }
});

document.addEventListener("click",e=>{
    if(!suppressNextClick) return;

    e.preventDefault();
    e.stopImmediatePropagation();
    suppressNextClick=false;
},true);

/*
    避免瀏覽器原生圖片／HTML 拖曳
    與自訂指標拖曳功能發生衝突。
*/
document.addEventListener("dragstart",e=>{
    if(e.target.closest("[data-drag-type]")){
        e.preventDefault();
    }
});

/* =========================
   原本的操作事件
   ========================= */

document.addEventListener("click",e=>{
    const pick=e.target.closest("[data-pick]");

    if(pick){
        const [side,index,pos]=pick.dataset.pick.split(":");
        openPicker(side,Number(index),Number(pos));
        return;
    }

    const clearTeam=e.target.closest("[data-clear-team]");

    if(clearTeam){
        state[clearTeam.dataset.clearTeam]=blankTeam();
        renderTeams();
        save();
        return;
    }

    const type=e.target.closest("[data-type]");

    if(type&&activePicker){
        const {side,index,pos}=activePicker;
        setType(side,index,pos,type.dataset.type);
        closePicker();
        return;
    }

    const primary=e.target.closest("[data-primary]");

    if(primary){
        primaryType=primary.dataset.primary;

        if(pairedType===primaryType){
            pairedType=null;
        }

        renderExplorer();
        return;
    }

    const pair=e.target.closest("tr[data-pair]");

    if(pair){
        pairedType=pair.dataset.pair||null;
        renderExplorer();
    }
});

/* 分析 Analysis */
document.getElementById("teamWeaknessBtn").addEventListener("click",()=>{
    teamAnalysisOpen=!teamAnalysisOpen;
    renderTeamAnalysis();
    save();
});

/* 鍵盤操作比較表 */
document.getElementById("researchTable").addEventListener("keydown",e=>{
    if(
        (e.key==="Enter"||e.key===" ")&&
        e.target.matches("tr[data-pair]")
    ){
        e.preventDefault();
        pairedType=e.target.dataset.pair||null;
        renderExplorer();
    }
});

/* 選擇器清除 */
document.getElementById("pickerClear").addEventListener("click",()=>{
    if(!activePicker) return;

    const {side,index,pos}=activePicker;
    setType(side,index,pos,null);
    closePicker();
});

document.getElementById("pickerClose")
    .addEventListener("click",closePicker);

document.getElementById("pickerCancel")
    .addEventListener("click",closePicker);

document.getElementById("pickerBackdrop").addEventListener("click",e=>{
    if(e.target===e.currentTarget){
        closePicker();
    }
});

document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&activePicker){
        closePicker();
    }

    if(e.key==="Tab"&&activePicker){
        const controls=[
            ...document.querySelectorAll("#pickerBackdrop button")
        ];

        const first=controls[0];
        const last=controls[controls.length-1];

        if(e.shiftKey&&document.activeElement===first){
            e.preventDefault();
            last.focus();
        }else if(!e.shiftKey&&document.activeElement===last){
            e.preventDefault();
            first.focus();
        }
    }
});

/* 初始化 */
renderTeams();
renderExplorer();

</script>
</body>
</html>
